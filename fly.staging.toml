# Staging: the same image as production, receiving every pull request first.
# No volume (data resets on each deploy), no payments, no AI key, and the
# machine stops when idle so it costs almost nothing between pull requests.
app = "blockchain-research-platform-staging"
primary_region = "jnb"

[build]

[env]
  DATA_DIR = "/data"
  SITE_DIR = "/data/site"
  SCREENSHOTS_ENABLED = "false"
  AI_ENABLED = "false"
  AI_REQUIRES_PAYMENT = "true"
  PAYMENTS_ENABLED = "false"
  PAYMENT_CHAINS = "84532"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/app/_stcore/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
