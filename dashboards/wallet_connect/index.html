<!DOCTYPE html>
<!--
  Streamlit custom component: sign in with a browser wallet.

  The wallet sign-in: a wallet address is a Web3 identity the user
  owns outright, unlike an email address which a provider can suspend. This
  component connects to the injected EIP-1193 provider (MetaMask and similar)
  and returns the selected address to Python. Off state: with no wallet
  extension present, the button says so and the dashboard works exactly as
  before - signing in is optional.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  /* Matches dashboards/ui/theme.py: 48px pill, secondary style, AA error colours */
  body { margin: 0; font-family: "Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #16181b; }
  #connect {
    width: 100%; min-height: 48px; padding: 0.6rem 1.2rem; border-radius: 999px;
    border: 1.5px solid #c8cace; background: transparent; color: inherit;
    font: inherit; font-size: 0.9375rem; font-weight: 600; cursor: pointer;
  }
  #connect:hover { border-color: #26272a; }
  #connect:focus-visible { outline: 3px solid #0b57c9; outline-offset: 2px; }
  #connect:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 0.4rem; font-size: 0.9375rem; line-height: 1.5; }
  #status.err { color: #b42318; }
  @media (prefers-color-scheme: dark) {
    body { color: #e9edf1; }
    #connect { border-color: #3a4450; }
    #connect:hover { border-color: #f3f5f7; }
    #status.err { color: #f08a85; }
  }
</style>
</head>
<body>
<button id="connect">Sign in with your wallet</button>
<div id="status"></div>
<script>
"use strict";

const btn = document.getElementById("connect");
const statusEl = document.getElementById("status");

function send(msg) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
}
function setHeight() {
  send({ type: "streamlit:setFrameHeight", height: document.body.scrollHeight + 10 });
}
function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.className = isError ? "err" : "";
  setHeight();
}

window.addEventListener("message", function (event) {
  const data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  setHeight();
});

btn.addEventListener("click", async function () {
  if (!window.ethereum) {
    setStatus("No browser wallet detected. Install MetaMask to sign in. The platform works without it.", true);
    return;
  }
  btn.disabled = true;
  try {
    setStatus("Connecting...");
    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    setStatus("");
    send({ type: "streamlit:setComponentValue", dataType: "json", value: { address: accounts[0] } });
  } catch (err) {
    const message = err && err.message ? err.message : String(err);
    setStatus("Could not connect: " + message, true);
    btn.disabled = false;
  }
});

send({ type: "streamlit:componentReady", apiVersion: 1 });
setHeight();
</script>
</body>
</html>
