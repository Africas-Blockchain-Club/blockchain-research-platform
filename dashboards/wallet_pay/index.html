<!DOCTYPE html>
<!--
  Streamlit custom component: pay for an AI write-up with whatever stablecoin
  the payer already holds.

  Speaks the Streamlit component postMessage protocol directly (componentReady,
  render, setComponentValue, setFrameHeight), so no build step or npm package
  is needed. Flow:
    1. Connect the injected EIP-1193 wallet (MetaMask, Rabby, Coinbase Wallet).
    2. Read the payer's balance of every accepted token on every accepted
       network through public RPCs, and preselect one they can afford, on the
       network the wallet is already using when possible.
    3. Switch (or add) that network in the wallet and send an ERC-20
       transfer(recipient, amount).
    4. Return {tx_hash, chain_id, payer_wallet} to Python, which verifies it
       on-chain before anything is unlocked.
  Off state: with no wallet extension, the button says so and the manual
  transaction-hash path in the dashboard remains available.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap">
<style>
  /* ABC tokens from dashboards/ui/theme.py: dark first, amber accent, 48px pills, AA colours.
     The theme follows Streamlit's own setting, sent with every render. */
  :root {
    --text: #f5f5f5; --muted: #a3a3a3; --line: rgba(255,255,255,0.18); --glass: rgba(255,255,255,0.06);
    --accent: #f99c00; --on-accent: #0a0a0a; --glow: rgba(249,156,0,0.35); --stop: #f87171;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --text: #171717; --muted: #525252; --line: #d4d4d4; --glass: rgba(10,10,10,0.03);
    --accent: #b75000; --on-accent: #ffffff; --glow: rgba(249,156,0,0.25); --stop: #b91c1c;
    color-scheme: light;
  }
  body { margin: 0; font-family: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); }
  button {
    width: 100%; min-height: 48px; padding: 0.7rem 1.4rem; border-radius: 999px;
    border: 1.5px solid var(--accent); background: var(--accent); color: var(--on-accent);
    font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button:hover:not(:disabled) { box-shadow: 0 0 0 4px var(--glow); }
  button:focus-visible, label:focus-within, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  /* Working, not broken: the button keeps its colour and says what is happening */
  button.working, button.working:disabled { opacity: 1; background: transparent; color: var(--accent); cursor: progress; }
  #options { display: none; margin: 0.75rem 0; gap: 0.5rem; }
  #options.show { display: grid; }
  .list { display: grid; gap: 0.5rem; }
  label {
    display: flex; align-items: center; gap: 0.6rem; min-height: 48px; padding: 0.5rem 0.9rem;
    border: 1px solid var(--line); border-radius: 12px; background: var(--glass); cursor: pointer; font-size: 0.9375rem;
  }
  label.muted { color: var(--muted); }
  label .bal { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type=radio] { width: 18px; height: 18px; accent-color: var(--accent); }
  details { margin-top: 0.25rem; }
  summary { padding: 0.65rem 0; cursor: pointer; color: var(--muted); font-size: 0.9375rem; }
  details .list { margin-top: 0.5rem; }
  #status { margin-top: 0.5rem; font-size: 0.9375rem; line-height: 1.5; }
  #status.err { color: var(--stop); }
</style>
</head>
<body>
<button id="connect" disabled>Loading...</button>
<div id="options" role="radiogroup" aria-label="Choose how to pay"></div>
<button id="pay" style="display:none" disabled>Pay</button>
<div id="status" role="status" aria-live="polite"></div>
<script>
"use strict";

let cfg = null;
let account = null;
let busy = false;
const connectBtn = document.getElementById("connect");
const payBtn = document.getElementById("pay");
const optionsEl = document.getElementById("options");
const statusEl = document.getElementById("status");

function send(msg) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*"); }
function setHeight() { send({ type: "streamlit:setFrameHeight", height: document.body.scrollHeight + 12 }); }
function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.className = isError ? "err" : "";
  setHeight();
}
function hex(n) { return "0x" + BigInt(n).toString(16); }
function pad(addrOrHex) { return addrOrHex.replace(/^0x/, "").toLowerCase().padStart(64, "0"); }
function units(atomic, decimals) {
  const value = Number(BigInt(atomic)) / Math.pow(10, decimals);
  return value.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

async function rpc(url, method, params) {
  const resp = await fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: method, params: params }),
  });
  const body = await resp.json();
  if (body.error) throw new Error(body.error.message || "the network's public endpoint returned an error");
  return body.result;
}

window.addEventListener("message", function (event) {
  const data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  cfg = data.args;
  if (data.theme && data.theme.base) document.documentElement.dataset.theme = data.theme.base;
  if (!account && !busy) {
    connectBtn.textContent = "Connect your wallet to pay " + cfg.price + " " + cfg.asset_label;
    connectBtn.disabled = false;
  }
  setHeight();
});

async function connect() {
  if (!cfg) return;
  if (!window.ethereum) {
    setStatus("No browser wallet found. Install MetaMask or another wallet extension, or use the manual option below.", true);
    return;
  }
  busy = true;
  connectBtn.disabled = true;
  try {
    setStatus("Connecting to your wallet...");
    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    account = accounts[0];
    setStatus("Checking which coins you can pay with...");
    await showOptions();
    connectBtn.style.display = "none";
  } catch (err) {
    setStatus("Could not connect: " + (err && err.message ? err.message : String(err)), true);
    connectBtn.disabled = false;
  } finally {
    busy = false;
  }
}

async function showOptions() {
  let currentChain = null;
  try { currentChain = parseInt(await window.ethereum.request({ method: "eth_chainId" }), 16); } catch (e) { /* keep null */ }

  const gasByChain = {};
  const checked = await Promise.all(cfg.options.map(async function (opt) {
    const result = Object.assign({}, opt, { balance: null, gas: null });
    try {
      const raw = await rpc(opt.rpc_url, "eth_call", [{ to: opt.token_contract, data: "0x70a08231" + pad(account) }, "latest"]);
      result.balance = BigInt(raw || "0x0");
      if (!(opt.chain_id in gasByChain)) {
        gasByChain[opt.chain_id] = rpc(opt.rpc_url, "eth_getBalance", [account, "latest"]).then(BigInt).catch(function () { return null; });
      }
      result.gas = await gasByChain[opt.chain_id];
    } catch (e) { /* balance unknown: still offered, listed last */ }
    return result;
  }));

  const enough = function (o) { return o.balance !== null && o.balance >= BigInt(o.amount_atomic); };
  const rank = function (o) {
    if (enough(o) && o.gas && o.gas > 0n) return o.chain_id === currentChain ? 0 : 1;
    if (enough(o)) return 2;
    if (o.balance === null) return 3;
    return 4;
  };
  checked.sort(function (a, b) { return rank(a) - rank(b); });

  optionsEl.innerHTML = "";
  // Ways this wallet can pay come first; the rest fold away, unless nothing can pay
  const canPay = checked.some(enough);
  const mainList = document.createElement("div");
  mainList.className = "list";
  const otherList = document.createElement("div");
  otherList.className = "list";
  checked.forEach(function (o, i) {
    const label = document.createElement("label");
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "opt";
    radio.value = String(i);
    radio.checked = i === 0;
    radio.addEventListener("change", updatePayButton);
    const text = document.createElement("span");
    text.textContent = o.token_symbol + " on " + o.chain_name;
    const bal = document.createElement("span");
    bal.className = "bal";
    if (o.balance === null) bal.textContent = "balance not checked";
    else if (!enough(o)) { bal.textContent = "you have " + units(o.balance, o.decimals); label.className = "muted"; }
    else if (!o.gas || o.gas === 0n) bal.textContent = "you have " + units(o.balance, o.decimals) + ", but no " + o.native_symbol + " for the fee";
    else bal.textContent = "you have " + units(o.balance, o.decimals);
    label.append(radio, text, bal);
    (canPay && o.balance !== null && !enough(o) ? otherList : mainList).appendChild(label);
  });
  optionsEl.appendChild(mainList);
  if (otherList.children.length) {
    const more = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "Other ways to pay (" + otherList.children.length + "), where this wallet holds less than " + cfg.price;
    more.append(summary, otherList);
    more.addEventListener("toggle", setHeight);
    optionsEl.appendChild(more);
  }
  optionsEl.checked = checked;
  optionsEl.classList.add("show");
  payBtn.style.display = "block";
  updatePayButton();

  if (!canPay) {
    setStatus("This wallet does not seem to hold " + cfg.price + " USDC or USDT on a supported network. You can still try, or top up first.", true);
  } else {
    setStatus("You also need a little of the network's own coin (shown above) to pay the network fee.");
  }
}

function selected() {
  const radio = optionsEl.querySelector("input:checked");
  return radio ? optionsEl.checked[Number(radio.value)] : null;
}

function updatePayButton() {
  const o = selected();
  payBtn.disabled = !o;
  if (o) payBtn.textContent = "Pay " + cfg.price + " " + o.token_symbol + " on " + o.chain_name;
  setHeight();
}

async function switchChain(o) {
  const chainIdHex = hex(o.chain_id);
  try {
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: chainIdHex }] });
  } catch (err) {
    if (err && err.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: chainIdHex,
          chainName: o.chain_name,
          nativeCurrency: { name: o.native_symbol, symbol: o.native_symbol, decimals: 18 },
          rpcUrls: [o.rpc_url],
          blockExplorerUrls: [o.explorer_url],
        }],
      });
    } else {
      throw err;
    }
  }
}

async function pay() {
  const o = selected();
  if (!o || busy) return;
  busy = true;
  payBtn.disabled = true;
  payBtn.classList.add("working");
  payBtn.textContent = "Waiting for your wallet...";
  try {
    setStatus("Switching your wallet to " + o.chain_name + "...");
    await switchChain(o);
    setStatus("Confirm the payment of " + cfg.price + " " + o.token_symbol + " in your wallet...");
    const data = "0xa9059cbb" + pad(cfg.recipient) + pad(hex(o.amount_atomic));
    const txHash = await window.ethereum.request({
      method: "eth_sendTransaction",
      params: [{ from: account, to: o.token_contract, data: data }],
    });
    payBtn.textContent = "Payment sent: checking it on-chain";
    setStatus("Payment sent. Checking it on-chain and writing your report; this can take a few minutes.");
    send({
      type: "streamlit:setComponentValue",
      dataType: "json",
      value: { tx_hash: txHash, chain_id: o.chain_id, payer_wallet: account },
    });
  } catch (err) {
    setStatus("Payment did not complete: " + (err && err.message ? err.message : String(err)), true);
    payBtn.classList.remove("working");
    payBtn.disabled = false;
    updatePayButton();
  } finally {
    busy = false;
  }
}

connectBtn.addEventListener("click", connect);
payBtn.addEventListener("click", pay);
send({ type: "streamlit:componentReady", apiVersion: 1 });
setHeight();
</script>
</body>
</html>
