# Streamlit's own theme, matched to the ABC tokens in dashboards/ui/theme.py.
# Both modes are defined, so the app follows the viewer's system setting
# and the viewer can still switch in the settings menu.

[server]
# Serves dashboards/static at app/static: the logo, mascot and home video
enableStaticServing = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[theme]
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 700, 700, 700]
baseRadius = "16px"
buttonRadius = "full"
showWidgetBorder = true

[theme.light]
primaryColor = "#b75000"
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#f5f5f4"
textColor = "#171717"
borderColor = "#d4d4d4"
linkColor = "#b75000"

[theme.dark]
primaryColor = "#f99c00"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#262626"
textColor = "#f5f5f5"
borderColor = "#404040"
linkColor = "#f99c00"
