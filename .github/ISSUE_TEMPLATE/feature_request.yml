name: Feature request
description: An idea for the platform
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What a learner or the operator cannot do today" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: The idea }
  - type: checkboxes
    id: rules
    attributes:
      label: Fits the platform
      options:
        - label: It explains and never rates or recommends (docs/COMPLIANCE.md)
          required: true
