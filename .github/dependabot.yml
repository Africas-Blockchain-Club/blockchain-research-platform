# Weekly update pull requests for every pinned dependency: Python packages, the
# GitHub Actions (pinned by commit), the Docker base images (pinned by digest)
# and the teaching example's npm packages.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: npm
    directory: /teaching/blockchain-wallet-explorer
    schedule: { interval: monthly }
