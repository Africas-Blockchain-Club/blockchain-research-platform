name: CI

# Lint, the offline test suite and a build of the static site. Runs on every pull
# request, and the deploy workflow runs it again on main before anything ships.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    # Pinned rather than ubuntu-latest, so a runner image change is a decision, not a surprise
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.10 is the minimum supported version; 3.12 is what the Docker image runs
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libraries for the PDF export
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build the static site
        run: python -m sitegen.build --out /tmp/site
