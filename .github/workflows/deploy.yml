name: Deploy to production

# A merge to main ships only after CI and the security checks pass on that exact
# commit, then a smoke test proves the live site answers. One deploy at a time.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/security.yml

  deploy:
    needs: [ci, security]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://blockchain-research-platform.fly.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml

  smoke-test:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The full check, paying steps included, so a deploy that breaks paying is
      # reported by email at once, not at the next scheduled run
      - name: Check the live site
        env:
          MONITOR_URL: https://blockchain-research-platform.fly.dev
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python scripts/monitor.py --full --email
