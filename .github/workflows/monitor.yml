name: Monitor the live site

# Runs on GitHub's machines, so it works while every laptop is closed.
#   every 30 minutes: quick check (DNS, health endpoint, payment networks)
#   every 3 hours: full check (every page in a real browser, the paying steps
#   up to the wallet with a test wallet that never pays, and the data pipeline
#   against the live data sources)
# GitHub runs scheduled jobs late or skips them when busy (in October 2026 the
# 30-minute check often ran only every 3 to 5 hours), so this is a safety net,
# not a guarantee.
#   every Monday at 07:00: full check that emails the result even when all pass
# A failure emails OWNER_ALERT_EMAIL (needs the SMTP_* secrets) and fails the
# run, which GitHub also emails to the repository owner.
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "15 */3 * * *"
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full check"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Decide which check to run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then echo "args=--full --email" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 */3 * * *" ]; then echo "args=--full --email" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 5 * * 1" ]; then echo "args=--full --email-always" >> "$GITHUB_OUTPUT"
          else echo "args=--email" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the libraries the full check needs
        if: contains(steps.mode.outputs.args, '--full')
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Install the libraries the quick check needs
        if: "!contains(steps.mode.outputs.args, '--full')"
        run: pip install requests python-dotenv
      - name: Check the live site
        run: python scripts/monitor.py ${{ steps.mode.outputs.args }}
