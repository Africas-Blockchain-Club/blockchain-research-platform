name: Security

# The cybersecurity standard: on every pull request, on main before each deploy
# (called by deploy.yml), and weekly so new vulnerabilities are caught without a change.
on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit pinned dependencies against known vulnerabilities (PyPA advisory database)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r requirements-x402.txt --progress-spinner off

  static-analysis:
    name: static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bandit (Python security linter)
        run: |
          pip install bandit==1.9.4
          bandit -q -r . -x ./tests,./teaching,./.venv -ll

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks across the full history
        env:
          VERSION: 8.30.1
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" sums.txt | awk '{print $1"  gitleaks.tgz"}' | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .

  container:
    name: container build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --tag blockchain-research-platform:ci .
      - name: The image runs as an unprivileged user and serves the site
        run: |
          docker run -d --name app -p 8080:8080 blockchain-research-platform:ci
          for i in $(seq 1 40); do curl -fsS http://localhost:8080/app/_stcore/health && break; sleep 2; done
          curl -fsS http://localhost:8080/ | grep -q "Learn to"
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
          # The slim image has no ps; read each process owner from /proc instead
          # (the probe's own shell runs as root and contains the pattern, so it skips itself)
          owners=$(docker exec app sh -c 'for p in /proc/[0-9]*; do [ "$p" = "/proc/$$" ] && continue; tr "\0" " " < $p/cmdline 2>/dev/null | grep -qE "caddy run|streamlit run|refresh_networks" && stat -c %U $p; done; true' | sort -u)
          echo "Process owners: $owners"
          test "$owners" = "app"
          docker logs app | tail -20
